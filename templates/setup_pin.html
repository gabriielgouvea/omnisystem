<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMNI — Criar PIN</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      background: #6366f1;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: white;
      margin-bottom: 12px;
    }
    .logo h1 { color: #f1f5f9; font-size: 22px; font-weight: 700; }
    .welcome { color: #a5b4fc; font-size: 14px; margin-top: 6px; }

    .info-box {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      border-radius: 10px;
      color: #c7d2fe;
      font-size: 13px;
      line-height: 1.6;
      padding: 14px 16px;
      margin-bottom: 28px;
    }
    .info-box strong { color: #a5b4fc; }

    .error {
      background: #450a0a;
      border: 1px solid #dc2626;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 18px; }
    label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 8px; }
    .pin-input {
      width: 100%;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 22px;
      letter-spacing: 12px;
      text-align: center;
      padding: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .pin-input:focus { border-color: #6366f1; }

    .btn-submit {
      width: 100%;
      background: #6366f1;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #4f46e5; }
    a.back { display: block; text-align: center; color: #64748b; font-size: 13px; margin-top: 16px; text-decoration: none; }
    a.back:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">O</div>
      <h1>Bem-vindo, {{ username }}!</h1>
      <p class="welcome">Primeiro acesso — crie seu PIN</p>
    </div>

    <div class="info-box">
      <strong>Atenção:</strong> Crie um PIN de <strong>4 números</strong> para acessar o sistema.<br>
      Você só precisará fazer isso uma vez.
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="username" value="{{ username }}" />
      <div class="field">
        <label>Escolha um PIN de 4 dígitos</label>
        <input type="password" name="pin" class="pin-input"
               maxlength="4" inputmode="numeric" pattern="[0-9]{4}"
               placeholder="••••" required autofocus />
      </div>
      <div class="field">
        <label>Confirme o PIN</label>
        <input type="password" name="pin_confirm" class="pin-input"
               maxlength="numeric" inputmode="numeric" pattern="[0-9]{4}"
               placeholder="••••" required />
      </div>
      <button type="submit" class="btn-submit">Criar PIN e Entrar</button>
    </form>
    <a href="{{ url_for('login') }}" class="back">← Voltar ao login</a>
  </div>
</body>
</html>
