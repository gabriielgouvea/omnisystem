<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMNI — Login</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      background: #6366f1;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: white;
      margin-bottom: 12px;
    }
    .logo h1 { color: #f1f5f9; font-size: 22px; font-weight: 700; }
    .logo p  { color: #94a3b8; font-size: 13px; margin-top: 4px; }

    h2 { color: #e2e8f0; font-size: 16px; font-weight: 600; margin-bottom: 16px; }

    .field { margin-bottom: 20px; position: relative; }
    label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 8px; }

    .dropdown-wrapper { position: relative; }
    .dropdown-trigger {
      width: 100%;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      color: #cbd5e1;
      font-size: 15px;
      font-weight: 500;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.15s;
      user-select: none;
    }
    .dropdown-trigger:hover, .dropdown-trigger.open { border-color: #6366f1; color: #f1f5f9; }
    .dropdown-trigger .arrow { transition: transform 0.2s; font-size: 11px; color: #64748b; }
    .dropdown-trigger.open .arrow { transform: rotate(180deg); }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: #1e293b;
      border: 2px solid #6366f1;
      border-radius: 10px;
      overflow: hidden;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .dropdown-menu.open { display: block; }
    .dropdown-item {
      padding: 13px 16px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }
    .dropdown-item:hover { background: #1e1b4b; color: #a5b4fc; }
    .dropdown-item:not(:last-child) { border-bottom: 1px solid #1e293b; }

    .pin-section { display: none; }
    .pin-section.visible { display: block; }
    .pin-input {
      width: 100%;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 22px;
      letter-spacing: 12px;
      text-align: center;
      padding: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    .pin-input:focus { border-color: #6366f1; }

    .error {
      background: #450a0a;
      border: 1px solid #dc2626;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }
    .btn-submit {
      width: 100%;
      background: #6366f1;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #4f46e5; }
    .btn-back {
      background: none;
      border: none;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      margin-top: 14px;
      display: block;
      width: 100%;
      text-align: center;
    }
    .btn-back:hover { color: #94a3b8; }
    input[type="hidden"] {}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">O</div>
      <h1>OMNI</h1>
      <p>Sistema de Operações</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" id="loginForm">
      <input type="hidden" name="username" id="hiddenUser" value="" />

      <div class="field">
        <label>Usuário</label>
        <div class="dropdown-wrapper">
          <div class="dropdown-trigger" id="dropdownTrigger" onclick="toggleDropdown()">
            <span id="selectedLabel">Selecione seu usuário</span>
            <span class="arrow">▼</span>
          </div>
          <div class="dropdown-menu" id="dropdownMenu">
            {% for u in users %}
            <div class="dropdown-item" onclick="selectUser('{{ u }}')">{{ u }}</div>
            {% endfor %}
          </div>
        </div>
      </div>

      <div class="pin-section" id="stepPin">
        <div class="field">
          <label id="pinLabel">PIN de 4 dígitos</label>
          <input type="password" name="pin" class="pin-input" id="pinInput"
                 maxlength="4" inputmode="numeric" pattern="[0-9]{4}"
                 placeholder="••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-submit">Entrar</button>
      </div>
    </form>
  </div>

  <script>
    function toggleDropdown() {
      document.getElementById('dropdownTrigger').classList.toggle('open');
      document.getElementById('dropdownMenu').classList.toggle('open');
    }
    function selectUser(name) {
      document.getElementById('hiddenUser').value = name;
      document.getElementById('selectedLabel').textContent = name;
      document.getElementById('dropdownTrigger').classList.remove('open');
      document.getElementById('dropdownMenu').classList.remove('open');
      document.getElementById('pinLabel').textContent = 'PIN de 4 dígitos — Olá, ' + name + '!';
      document.getElementById('stepPin').classList.add('visible');
      setTimeout(() => document.getElementById('pinInput').focus(), 100);
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.dropdown-wrapper')) {
        document.getElementById('dropdownTrigger').classList.remove('open');
        document.getElementById('dropdownMenu').classList.remove('open');
      }
    });
    {% if error %}
    document.getElementById('stepPin').classList.add('visible');
    {% endif %}
  </script>
</body>
</html>
